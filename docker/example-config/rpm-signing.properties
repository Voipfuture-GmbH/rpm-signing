# Example configuration file for the RPM signing server.
#
# You can pass the configuration file with 'server -c /path/to/rpm-signing.properties', 
# or set the RPM_SIGN_CONFIG environment variable (which takes precedence over -c).
#
# By default the Docker image build using the docker/build.sh scriptp expects the 
# configuration file to be mounted at /config/rpm-signing.properties.
#
# File format
# -----------
# One 'key = value' pair per line; whitespace around the key and the value is
# stripped. Blank lines are ignored, and so are lines whose first non-blank
# character is '#'.
#
# - Trailing comments are NOT supported.
# - Any unrecognized key is a fatal error.
# - Booleans configurations accept 1, on, true, 0, off and false.

# Address the HTTP API listens on, in Go's host:port notation. Leaving off the
# host, as below, listens on every interface. Optional; defaults to ':8080'.
listen_address = :8080

# Shared secret that callers must present as the 'authToken' query parameter on
# POST /sign, e.g. 'POST /sign?authToken=...'. Requests with a missing or wrong
# token are rejected with 403. Required: the server refuses to start if this key
# is absent or blank. GET /publickey is not protected by it.
api_signing_token = test 

# ASCII-armored GPG public key matching the private key below. Served verbatim
# by GET /publickey so clients can verify the RPMs they get back. Required: the
# file must exist and be parsable at startup.
gpg_public_key = /config/signing-key.pub.gpg.asc

# ASCII-armored GPG private key used to sign incoming RPM data. Required: the
# file must exist and, together with the password below, must decrypt at
# startup. Keep it readable only by the server's user.
gpg_private_key = /config/signing-key.priv.gpg.asc

# Passphrase protecting the private key above. Omit the line entirely if the key
# is not passphrase-protected.
gpg_private_key_password =

# Trace-level logging of RPM parsing and signing, the most detailed level there
# is. Takes precedence over 'verbose' below. Optional; defaults to off, and
# passing -d/--debug on the command line turns it on regardless of this value.
debug = true

# Debug-level logging: more than the default (info), less than 'debug' above.
# Optional; defaults to off, and passing -v/--verbose on the command line turns
# it on regardless of this value.
verbose = false

# Path to the client binary that GET /clientDownload streams back. Optional; if
# the line is omitted or the value is blank, /clientDownload answers with 400.
# If a path IS given, the file must exist or the server refuses to start. The
# Docker image ships the client at the path below.
rpm_sign_client_binary = /usr/local/bin/client

# Path to access log file.
# If not set, the access log will be written using the default logger
# By default the access log will not contain any URL parameters for security reasons.
# Set debug = true to override this behaviour.
access_log =